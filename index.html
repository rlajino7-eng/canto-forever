<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Canto - Módulos</title>
    <style>
        /* Estilos generales de la página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        /* --- ESTILOS DEL GUÍA VIRTUAL --- */
        /* Botón flotante */
        #btn-guia {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        #btn-guia:hover {
            background-color: #1a252f;
        }

        /* Ventana del chat/guía */
        #ventana-guia {
            display: none; /* Oculto por defecto */
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 320px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera de la ventana */
        .guia-header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* Área de mensajes */
        .guia-mensajes {
            height: 250px;
            padding: 15px;
            overflow-y: auto;
            background-color: #fafafa;
        }
        
        /* Mensaje inicial del guía */
        .mensaje-bot {
            background-color: #e0e0e0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }

        /* Área para escribir */
        .guia-input {
            display: flex;
            border-top: 1px solid #ccc;
        }
        .guia-input input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
        }
        .guia-input button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 0 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Contenido principal de tu página -->
    <h1>Bienvenido a tu entrenamiento</h1>
    <p>Aquí irá el contenido de tus módulos de 2 horas...</p>

    <!-- ========================================== -->
    <!-- CÓDIGO DEL WIDGET DEL GUÍA VIRTUAL           -->
    <!-- ========================================== -->
    
    <!-- Botón para abrir el guía -->
    <button id="btn-guia" onclick="toggleGuia()">🎤 Habla con tu Guía</button>

    <!-- Ventana del Guía -->
    <div id="ventana-guia" style="display: none;">
        <div class="guia-header">
            Tu Guía Vocal IA
        </div>
        <div class="guia-mensajes" id="chat-box">
            <!-- Aquí puedes poner el guion inicial que armemos -->
            <div class="mensaje-bot">
                ¡Hola! Soy tu asistente de entrenamiento. ¿En qué parte de tu técnica vocal o módulo te puedo ayudar hoy?
            </div>
        </div>
        <div class="guia-input">
            <input type="text" id="user-input" placeholder="Escribe tu duda aquí...">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <!-- Script para darle interactividad al widget -->
    <script>
        // Función para abrir/cerrar la ventana
        function toggleGuia() {
            var ventana = document.getElementById("ventana-guia");
            if (ventana.style.display === "none") {
                ventana.style.display = "flex";
            } else {
                ventana.style.display = "none";
            }
        }

        // Función básica para mostrar lo que escribe el alumno
        function enviarMensaje() {
            var input = document.getElementById("user-input");
            var mensaje = input.value;
            
            if(mensaje.trim() !== "") {
                var chatBox = document.getElementById("chat-box");
                
                // Mostrar el mensaje del usuario
                chatBox.innerHTML += `<div class="mensaje-bot" style="background-color: #d1ecf1; text-align: right;">${mensaje}</div>`;
                
                // Limpiar la barra de texto
                input.value = "";
                
                // Auto-scroll hacia abajo
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
