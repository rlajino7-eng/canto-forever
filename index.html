<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canto Forever — Tu profesora virtual de canto</title>
  <style>
    :root{
      --blue:#4169e1;--purple:#7c3aed;--turq:#14b8a6;--yellow:#f4c542;--coral:#ff6b6b;
      --ink:#182033;--muted:#667085;--bg:#f7f9fc;--card:#fff;--line:#e7eaf0;--shadow:0 14px 40px rgba(24,32,51,.08)
    }
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
    button,input,textarea,select{font:inherit}.sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;z-index:5}
    .brand{display:flex;align-items:center;gap:10px;font-size:16px;letter-spacing:.5px;margin:4px 8px 28px}.brand>span{font-size:30px}.brand strong{font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px;letter-spacing:0}
    nav{display:grid;gap:7px}.nav-btn{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:12px;color:#526071;cursor:pointer;display:flex;gap:11px;align-items:center}.nav-btn:hover,.nav-btn.active{background:#eef2ff;color:var(--blue);font-weight:700}
    .sidebar-bottom{margin-top:auto}.mini-progress{padding:14px;background:#f8f9fc;border-radius:15px;margin-bottom:10px}.mini-progress span{font-size:12px;color:var(--muted)}.mini-progress strong{float:right;font-size:12px}.progress{height:7px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--turq));border-radius:99px}
    .main{margin-left:255px;min-height:100vh}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.eyebrow{font-size:11px;letter-spacing:1.6px;color:#8a93a3;font-weight:800}.icon-btn{display:none;border:0;background:none;font-size:22px}.top-actions{display:flex;align-items:center;gap:14px;color:#667085;font-size:13px}.avatar{border:0;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-weight:800}
    #app{max-width:1280px;margin:auto;padding:34px}.hero{background:linear-gradient(135deg,#fff,#f1f5ff);border:1px solid var(--line);border-radius:25px;padding:30px;display:grid;grid-template-columns:1.35fr .65fr;gap:25px;box-shadow:var(--shadow)}
    .hero h1{font-size:35px;line-height:1.08;margin:10px 0}.hero p{color:var(--muted);line-height:1.65;max-width:680px}.tag{display:inline-flex;padding:7px 11px;border-radius:99px;background:#e9edff;color:var(--blue);font-size:11px;font-weight:800}.teacher-card{background:#fff;border-radius:22px;padding:22px;border:1px solid var(--line);align-self:stretch}.teacher-face{height:115px;border-radius:18px;background:linear-gradient(135deg,#e9e4ff,#d9f8f3);display:flex;align-items:center;justify-content:center;font-size:68px;margin-bottom:15px}.teacher-card p{font-size:13px;line-height:1.55;color:#536070}
    .btn{border:0;border-radius:12px;padding:12px 17px;cursor:pointer;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2ff;color:var(--blue)}.ghost{background:#f2f4f7;color:#475467}.danger{background:#fff0f0;color:#c0392b}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:34px 0 15px}.section-head h2{margin:0;font-size:21px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(24,32,51,.04)}.stat .num{font-size:27px;font-weight:900;margin-top:8px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.class-card{position:relative}.class-card .day{font-size:11px;color:var(--blue);font-weight:900}.class-card h3{margin:8px 0}.class-card p{color:var(--muted);font-size:13px;line-height:1.5}.done{position:absolute;right:16px;top:16px;font-size:12px;color:#159b75}
    .class-shell{max-width:980px;margin:auto}.class-header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.class-header h1{font-size:32px;margin:4px 0}.lesson-grid{display:grid;grid-template-columns:1fr 290px;gap:18px}.lesson-main,.lesson-side{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px}.lesson-main h2{margin-top:0}.teacher-bubble{background:#f1f5ff;border-left:4px solid var(--blue);padding:16px;border-radius:12px;line-height:1.6}.exercise{border:1px solid var(--line);border-radius:15px;padding:17px;margin:14px 0}.exercise h3{margin:0 0 8px}.exercise-actions{display:flex;gap:8px;flex-wrap:wrap}.timer{font-size:34px;font-weight:900;text-align:center;padding:15px}.question{background:#fff9e6;border:1px solid #f4df93;padding:17px;border-radius:15px;margin-top:15px}.question input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:10px 0}.bar{height:9px;background:#edf0f4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--turq))}
    .list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;padding:15px;background:#fff;border:1px solid var(--line);border-radius:14px}.row strong{display:block}.row small{color:var(--muted)}
    textarea,input,select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cfd5df;border-radius:18px}
    .toast{position:fixed;right:25px;bottom:25px;background:#182033;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.25s;z-index:20}.toast.show{opacity:1;transform:none}
    
    /* ESTILOS DE LAS NUEVAS HERRAMIENTAS INTERACTIVAS */
    .tuner-box { background: #1e293b; color: white; border-radius: 18px; padding: 30px; text-align: center; }
    .note-display { font-size: 5rem; font-weight: bold; color: #38bdf8; margin: 15px 0; }
    .breath-circle { width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--turq)); margin: 30px auto; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.3rem; font-weight: bold; transition: transform 4s ease-in-out; box-shadow: 0 0 30px rgba(20, 184, 166, 0.4); }
    .breath-circle.inhale { transform: scale(1.6); }
    .breath-circle.exhale { transform: scale(1); }

    @media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.main{margin-left:0}.icon-btn{display:block}.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}.lesson-grid{grid-template-columns:1fr}}
    @media(max-width:600px){#app{padding:18px}.topbar{padding:0 18px}.cards,.stats,.grid2{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:28px}.class-header{align-items:flex-start;flex-direction:column}.lesson-main,.lesson-side{padding:18px}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span>🎤</span><div><strong>CANTO</strong> FOREVER<small>Tu voz. Tu proceso.</small></div></div>
    <nav>
      <button class="nav-btn active" data-view="dashboard">🏠 <span>Inicio</span></button>
      <button class="nav-btn" data-view="classes">🎓 <span>Mis clases</span></button>
      <button class="nav-btn" data-view="exercises">🎯 <span>Ejercicios</span></button>
      <button class="nav-btn" data-view="ear">👂 <span>Entrenamiento auditivo</span></button>
      <button class="nav-btn" data-view="tools">🛠️ <span>Sala de ensayo</span></button>
      <button class="nav-btn" data-view="record">🎤 <span>Mi voz</span></button>
      <button class="nav-btn" data-view="progress">📊 <span>Mi progreso</span></button>
      <button class="nav-btn" data-view="notebook">📓 <span>Mi cuaderno</span></button>
      <button class="nav-btn" data-view="repertoire">🎵 <span>Mi repertorio</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="mini-progress"><span>Programa</span><strong id="sideProgress">0 / 60</strong><div class="progress"><i id="sideBar"></i></div></div>
      <button class="nav-btn" data-view="settings">⚙️ <span>Configuración</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><button id="menuToggle" class="icon-btn">☰</button><div class="eyebrow">ACADEMIA VIRTUAL DE CANTO</div></div>
      <div class="top-actions"><span id="streak">🔥 0 días</span><button class="avatar">R</button></div>
    </header>

    <section id="app"></section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- LÓGICA INTEGRA DE LA APLICACIÓN Y HERRAMIENTAS VOCALES -->
  <script>
    const STORE_KEY = "cantoForeverProgress";
    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { completed: [], notes: {}, answers: {}, recordings: [], streak: 0, lastDate: null }; }
      catch { return { completed: [], notes: {}, answers: {}, recordings: [], streak: 0, lastDate: null }; }
    }
    let STATE = loadState();
    function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }
    function completeClass(id) { if (!STATE.completed.includes(id)) { STATE.completed.push(id); STATE.completed.sort((a,b)=>a-b); updateStreak(); saveState(); } }
    function updateStreak() { const today = new Date().toISOString().slice(0,10); if (STATE.lastDate !== today) { STATE.streak++; STATE.lastDate = today; } }
    function isComplete(id) { return STATE.completed.includes(id); }
    function pct() { return Math.round(STATE.completed.length / 60 * 100); }

    const CLASS_TEMPLATE = [
      ["Conociendo tu voz","voz","Aprender qué es la voz, cómo se produce y comenzar a escuchar el propio instrumento."],
      ["Postura y alineación corporal","postura","Establecer una postura alineada, cómoda y preparada para cantar."],
      ["Respiración para cantar","respiracion","Comprender y practicar la respiración aplicada al canto."],
      ["Control del aire","respiracion","Aprender a dosificar y estabilizar el flujo de aire."],
      ["Relajación y eliminación de tensión","relajacion","Identificar y liberar tensiones que interfieren con la emisión."],
      ["Cómo se produce la voz","voz","Comprender el proceso básico de producción vocal."],
      ["Cuerdas vocales y emisión","emision","Relacionar la producción del sonido con una emisión coordinada."],
      ["Resonancia","resonancia","Explorar sensaciones de resonancia y claridad vocal."],
      ["Articulación y vocales","articulacion","Trabajar vocales y movimientos articulatorios para una emisión clara."],
      ["Dicción","diccion","Mejorar claridad y precisión de las palabras al cantar."],
      ["Oído musical","oido","Comenzar el entrenamiento para reconocer y reproducir diferencias de altura."],
      ["Graves y agudos","extension","Explorar registros de altura sin forzar la voz."],
      ["Afinación","afinacion","Desarrollar la capacidad de igualar y sostener notas."],
      ["Pulso y ritmo","ritmo","Comprender pulso, tempo y coordinación rítmica."],
      ["Primeras vocalizaciones","vocalizacion","Integrar respiración, emisión y afinación mediante vocalizaciones."],
      ["Calentamiento vocal completo","calentamiento","Construir una rutina segura de preparación vocal."],
      ["Control de la voz","control","Mejorar estabilidad, coordinación y control."],
      ["Proyección sin forzar","proyeccion","Aprender a proyectar con coordinación y sin empujar."],
      ["Respiración + voz + afinación","integracion","Integrar los fundamentos trabajados durante el mes."],
      ["Evaluación completa del Mes 1","evaluacion","Evaluar fundamentos y determinar puntos de refuerzo."],
      ["Voz de pecho","registros","Explorar la coordinación de pecho con seguridad."],
      ["Voz de cabeza","registros","Explorar la coordinación de cabeza y sus sensaciones."],
      ["Falsete","registros","Comprender y practicar el falsete sin forzar."],
      ["Transición de registros","registros","Trabajar cambios entre zonas vocales."],
      ["Voz mixta","mixta","Introducir la coordinación de mezcla de registros."],
      ["Extensión vocal","extension","Ampliar progresivamente el rango dentro de límites cómodos."],
      ["Graves y zona media","extension","Estabilizar graves y zona media."],
      ["Agudos con seguridad","agudos","Trabajar alturas superiores sin empujar."],
      ["Resonancia y colocación","resonancia","Refinar sensaciones de resonancia y colocación."],
      ["Control y estabilidad","control","Desarrollar consistencia de emisión."],
      ["Dinámica y volumen","dinamica","Trabajar cambios de intensidad controlados."],
      ["Legato","musicalidad","Conectar notas y frases con continuidad."],
      ["Staccato","musicalidad","Practicar ataques breves y controlados."],
      ["Ataques y finales","emision","Mejorar inicio y cierre de sonidos."],
      ["Escalas","musicalidad","Aplicar escalas al entrenamiento vocal."],
      ["Arpegios","musicalidad","Aplicar arpegios para coordinación y oído."],
      ["Intervalos","oido","Reconocer y reproducir distancias entre notas."],
      ["Afinación avanzada","afinacion","Aumentar precisión y estabilidad de afinación."],
      ["Respiración aplicada","respiracion","Usar la respiración dentro de frases musicales."],
      ["Musicalidad y fraseo","musicalidad","Comencemos a tomar decisiones musicales conscientes."],
      ["Interpretación","interpretacion","Trabajar intención y comunicación."],
      ["Emoción y expresión","interpretacion","Relacionar emoción, intención y expresión vocal."],
      ["Fraseo","interpretacion","Construir frases con dirección musical."],
      ["Dinámica aplicada","dinamica","Aplicar contrastes dinámicos a material musical."],
      ["Respiración musical","respiracion","Planificar respiraciones dentro de una canción."],
      ["Canto con acompañamiento","repertorio","Coordinar voz con acompañamiento."],
      ["Canto con pista","repertorio","Practicar con una pista manteniendo pulso y melodía."],
      ["Análisis de canciones","repertorio","Analizar estructura, tonalidad, melodía y dificultades."],
      ["Tonalidades y adaptación","repertorio","Comprender cómo una tonalidad afecta la comodidad vocal."],
      ["Melodía y ritmo","musicalidad","Integrar melodía y ritmo en material completo."],
      ["Grabación y autoescucha","grabacion","Aprender a grabarse y escuchar críticamente."],
      ["Análisis de grabaciones","grabacion","Identificar fortalezas y puntos de trabajo en grabaciones."],
      ["Micrófono: distancia y posición","microfono","Conocer principios básicos de uso del micrófono."],
      ["Micrófono: volumen y dinámica","microfono","Aplicar dinámica y distancia al micrófono."],
      ["Presencia y confianza","presencia","Prepararse para cantar frente a otras personas."],
      ["Comunicación con el público","presencia","Trabajar intención y conexión."],
      ["Canción completa: preparación","repertorio","Preparar una canción siguiendo un proceso completo."],
      ["Canción completa: práctica","repertorio","Practicar una canción completa por etapas."],
      ["Presentación final","evaluacion","Preparar la presentación final del programa."],
      ["Evaluación vocal final","evaluacion","Evaluar técnica, oído, ritmo y musicalidad."]
    ];

    const CLASSES = CLASS_TEMPLATE.map((x,i)=>({
      id:i+1, month:i<20?1:i<40?2:3, week:Math.floor(i/5)+1, day:(i%5)+1,
      title:x[0], category:x[1], objective:x[2],
      duration:120,
      theory:[
        `En esta clase vamos a trabajar ${x[0].toLowerCase()}.`,
        `La profesora te explicará el concepto desde la perspectiva de un cantante y lo conectará con la práctica.`,
        `Aprenderás qué debes observar, qué errores son frecuentes y cómo comprobar tu propio trabajo.`
      ],
      teacherScript:`Bienvenido a la clase ${i+1}. Hoy vamos a trabajar ${x[0].toLowerCase()}. No buscamos perfección inmediata: buscamos comprender, practicar y comprobar lo aprendido.`,
      exercises:[
        {name:`Preparación — ${x[0]}`,minutes:8,instructions:`Adopta una postura cómoda, respira con naturalidad y prepara la voz sin forzar. Sigue las indicaciones de la profesora.`},
        {name:`Ejercicio principal`,minutes:12,instructions:`Realiza el ejercicio lentamente. Haz las repeticiones indicadas y descansa si aparece fatiga o molestia.`},
        {name:`Aplicación`,minutes:10,instructions:`Lleva el concepto a una vocalización o frase breve. Escucha lo que ocurre y anota cualquier dificultad.`}
      ],
      questions:[
        `¿Cuál es el objetivo principal de esta clase?`,
        `¿Qué sensación o resultado deberías observar durante la práctica?`
      ],
      evaluation:[`Comprendí el concepto`,`Pude realizar el ejercicio`,`Identifiqué una dificultad`,`Sé qué practicar después`],
      homework:`Repite el ejercicio principal durante 10–15 minutos, sin forzar la voz, y registra en el cuaderno qué sentiste y qué te costó.`,
      summary:`Hoy trabajaste ${x[0].toLowerCase()}. Guarda tus observaciones y utiliza el sistema de repaso si necesitas reforzarlo.`
    }));

    const EXERCISES = [
     {id:1,cat:"Respiración",name:"Flujo de aire controlado",level:"Inicial",duration:5,desc:"Practica una exhalación controlada y cómoda, observando estabilidad sin tensión."},
     {id:2,cat:"Calentamiento",name:"Preparación vocal suave",level:"Inicial",duration:8,desc:"Rutina breve de preparación sin forzar ni buscar volumen."},
     {id:3,cat:"Resonancia",name:"Exploración de resonancia",level:"Inicial",duration:7,desc:"Observa las sensaciones de vibración mientras produces sonidos cómodos."},
     {id:4,cat:"Afinación",name:"Igualar una nota",level:"Inicial",duration:8,desc:"Escucha una nota de referencia e intenta reproducirla."},
     {id:5,cat:"Ritmo",name:"Pulso con metrónomo",level:"Inicial",duration:6,desc:"Marca el pulso y coordina una vocalización sencilla con el metrónomo."},
     {id:6,cat:"Registros",name:"Exploración pecho-cabeza",level:"Intermedio",duration:10,desc:"Explora cambios de coordinación sin empujar la voz."},
     {id:7,cat:"Agudos",name:"Ascenso progresivo",level:"Intermedio",duration:8,desc:"Sube gradualmente dentro de una zona cómoda. Detente si aparece esfuerzo."},
     {id:8,cat:"Voz mixta",name:"Transición suave",level:"Intermedio",duration:10,desc:"Practica una transición gradual entre zonas vocales."},
     {id:9,cat:"Musicalidad",name:"Legato",level:"Intermedio",duration:8,desc:"Conecta sonidos de manera continua y controlada."},
     {id:10,cat:"Oído",name:"Reconocimiento de intervalos",level:"Avanzado",duration:10,desc:"Escucha dos notas e identifica si la distancia es mayor o menor."}
    ];

    function teacherMessage(context){
      const c=context?.class;
      if(!c) return "Hola. Soy tu profesora de Canto Forever. Vamos a trabajar paso a paso.";
      return `Hola. Hoy estamos en la clase ${c.id}: ${c.title}. ${c.objective} Recuerda: primero entendemos, después practicamos y finalmente comprobamos lo aprendido.`;
    }

    const app=document.getElementById("app");
    let currentClass=null,timer=null,timerSeconds=0;

    function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2600);}
    function render(){
      document.getElementById("sideProgress").textContent=`${STATE.completed.length} / 60`;
      document.getElementById("sideBar").style.width=pct()+"%";
      document.getElementById("streak").textContent=`🔥 ${STATE.streak||0} días`;
    }
    function dashboard(){
     const next=CLASSES.find(c=>!isComplete(c.id))||CLASSES[59];
     app.innerHTML=`<div class="hero">
       <div><span class="tag">ENTRENAMIENTO VOCAL · ${next.month===1?"MES 1":next.month===2?"MES 2":"MES 3"}</span>
       <h1>Tu voz. Tu proceso.<br>Tu mejor versión. 🎤</h1>
       <p>Canto Forever te acompaña con un programa intensivo de 3 meses. Aprende, escucha, practica, canta, graba, evalúa y mejora.</p>
       <button class="btn primary" onclick="openClass(${next.id})">🎓 ${isComplete(next.id)?"Ver clase":"Comenzar clase"}</button></div>
       <div class="teacher-card"><div class="teacher-face">👩‍🏫</div><strong>Tu profesora virtual</strong><p id="teacherGreeting">${teacherMessage({class:next})}</p><button class="btn secondary" onclick="speak('${teacherMessage({class:next}).replaceAll("'","") }')">▶️ Escuchar profesora</button></div>
     </div>
     <div class="section-head"><div><h2>Tu entrenamiento de hoy</h2><p>La siguiente clase de tu recorrido</p></div></div>
     <div class="stats">
      <div class="stat"><span class="muted">Clases</span><div class="num">${STATE.completed.length}/60</div><div class="progress"><i style="width:${pct()}%"></i></div></div>
      <div class="stat"><span class="muted">Horas</span><div class="num">${Math.round(STATE.completed.length*2)}</div><span class="muted">de ~120 horas</span></div>
      <div class="stat"><span class="muted">Programa</span><div class="num">${pct()}%</div><span class="muted">completado</span></div>
      <div class="stat"><span class="muted">Constancia</span><div class="num">🔥 ${STATE.streak||0}</div><span class="muted">días registrados</span></div>
     </div>
     <div class="section-head"><div><h2>Áreas de formación</h2><p>Construye tu instrumento de forma progresiva</p></div></div>
     <div class="cards">${["Técnica vocal","Musicalidad","Entrenamiento auditivo","Interpretación","Repertorio","Cuidado vocal"].map((x,i)=>`<div class="card"><div style="font-size:28px">${["🫁","🎼","👂","❤️","🎵","🧘"][i]}</div><h3>${x}</h3><p class="muted">Contenido progresivo integrado en tus clases y ejercicios.</p></div>`).join("")}</div>`;
     render();
    }
    function classesView(){
     app.innerHTML=`<div class="section-head"><div><h2>🎓 Mis 60 clases</h2><p>3 meses · lunes a viernes · aproximadamente 2 horas por sesión</p></div></div>
     <div class="cards">${CLASSES.map(c=>`<div class="card class-card"><span class="day">MES ${c.month} · SEMANA ${c.week} · DÍA ${c.day}</span>${isComplete(c.id)?'<span class="done">✓ Completada</span>':''}<h3>${c.title}</h3><p>${c.objective}</p><button class="btn ${isComplete(c.id)?"secondary":"primary"}" onclick="openClass(${c.id})">${isComplete(c.id)?"Repasar":"Comenzar"} · 120 min</button></div>`).join("")}</div>`;
    }
    function openClass(id){
     currentClass=CLASSES.find(c=>c.id===id);
     app.innerHTML=`<div class="class-shell">
     <div class="class-header"><div><span class="tag">MES ${currentClass.month} · DÍA ${currentClass.day}</span><h1>${currentClass.title}</h1><p class="muted">${currentClass.objective}</p></div><button class="btn ghost" onclick="classesView()">← Volver</button></div>
     <div class="bar"><i style="width:${isComplete(id)?100:8}%"></i></div>
     <div class="lesson-grid" style="margin-top:18px">
      <article class="lesson-main">
       <h2>👩‍🏫 Profesora</h2><div class="teacher-bubble">${currentClass.teacherScript}</div>
       <button class="btn secondary" style="margin-top:12px" onclick="speak(currentClass.teacherScript)">▶️ Escuchar profesora</button>
       <h2 style="margin-top:28px">📖 Teoría</h2>${currentClass.theory.map(t=>`<p>${t}</p>`).join("")}
       <div class="question"><strong>Pregunta de comprensión</strong><p>${currentClass.questions[0]}</p><input id="answer" placeholder="Escribe tu respuesta..."><button class="btn secondary" onclick="saveAnswer()">Comprobar respuesta</button></div>
       <h2 style="margin-top:28px">🎯 Práctica guiada</h2>${currentClass.exercises.map((e,i)=>`<div class="exercise"><h3>Ejercicio ${i+1}: ${e.name}</h3><p>${e.instructions}</p><div class="exercise-actions"><button class="btn primary" onclick="startTimer(${e.minutes*60})">⏱ ${e.minutes} min</button><button class="btn secondary" onclick="speak('${e.instructions.replaceAll("'","")}')">▶️ Escuchar</button><button class="btn ghost" onclick="startRecording()">🎤 Grabar</button></div></div>`).join("")}
       <h2>👂 Entrenamiento auditivo</h2><p>Escucha, repite y comprueba tu percepción. Usa el módulo de entrenamiento auditivo desde el menú cuando quieras una sesión adicional.</p>
       <button class="btn secondary" onclick="navigate('ear')">👂 Abrir entrenamiento auditivo</button>
       <h2 style="margin-top:28px">📝 Evaluación</h2>${currentClass.evaluation.map((x,i)=>`<label style="display:block;margin:10px 0"><input type="checkbox" class="eval" style="width:auto;margin-right:8px">${x}</label>`).join("")}
       <h2>📚 Tarea</h2><div class="teacher-bubble">${currentClass.homework}</div>
       <button class="btn primary" style="margin-top:20px" onclick="finishClass(${id})">🎉 Completar clase</button>
      </article>
      <aside class="lesson-side"><h3>Progreso de clase</h3><div class="timer" id="timer">05:00</div><button class="btn ghost" onclick="resetTimer()">Reiniciar temporizador</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><strong>Objetivo</strong><p class="muted">${currentClass.objective}</p><strong>Duración</strong><p class="muted">Aproximadamente 2 horas</p><strong>Estado</strong><p>${isComplete(id)?"🟢 Completada":"🟡 En progreso"}</p></aside>
     </div></div>`;
    }
    function saveAnswer(){const a=document.getElementById("answer")?.value.trim();if(!a){toast("Escribe una respuesta primero.");return}STATE.answers[currentClass.id]=a;saveState();toast("Respuesta guardada. La profesora tendrá este dato en tu progreso.");}
    function finishClass(id){completeClass(id);toast("Clase completada. ¡Excelente trabajo!");setTimeout(()=>dashboard(),500);}
    function startTimer(s){clearInterval(timer);timerSeconds=s;updateTimer();timer=setInterval(()=>{timerSeconds--;updateTimer();if(timerSeconds<=0){clearInterval(timer);toast("⏰ Tiempo completado. Tómate un descanso si lo necesitas.");}},1000);}
    function resetTimer(){clearInterval(timer);timerSeconds=300;updateTimer();}
    function updateTimer(){const el=document.getElementById("timer");if(!el)return;const m=Math.floor(timerSeconds/60),s=timerSeconds%60;el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}
    function exercisesView(){
     app.innerHTML=`<div class="section-head"><div><h2>🎯 Biblioteca de ejercicios</h2><p>Ejercicios progresivos para complementar tus clases.</p></div></div><div class="cards">${EXERCISES.map(e=>`<div class="card"><span class="day">${e.cat} · ${e.level}</span><h3>${e.name}</h3><p>${e.desc}</p><p class="muted">⏱ ${e.duration} min</p><button class="btn primary" onclick="startTimer(${e.duration*60});toast('Ejercicio iniciado')">Comenzar</button></div>`).join("")}</div>`;
    }
    function earView(){
     app.innerHTML=`<div class="section-head"><div><h2>👂 Entrenamiento del oído</h2><p>Progresa desde grave/agudo hasta melodías y detección de afinación.</p></div></div><div class="cards">${["Grave / agudo","Reconocer notas","Repetir notas","Intervalos","Patrones","Melodías","Ritmos","Detectar errores de afinación"].map((x,i)=>`<div class="card"><span class="day">NIVEL ${i+1}</span><h3>${x}</h3><p class="muted">Ejercicio progresivo de percepción auditiva.</p><button class="btn secondary" onclick="playTone(${220+i*30})">▶️ Escuchar referencia</button></div>`).join("")}</div>`;
    }
    
    // --- NUEVA VISTA: SALA DE ENSAYO (Afinador y Respiración Interactiva) ---
    function toolsView(){
      app.innerHTML=`
        <div class="section-head"><div><h2>🛠️ Sala de Ensayo</h2><p>Herramientas interactivas para entrenar tu voz con medición real.</p></div></div>
        
        <div class="grid2">
          <!-- AFINADOR EN VIVO -->
          <div class="card tuner-box">
            <h3 style="margin-top:0; color:#38bdf8;">🎙️ Afinador de Voz en Vivo</h3>
            <p style="color:#94a3b8; font-size:13px;">Canta una nota sostenida (vocal "U" u "O") frente a tu micrófono.</p>
            <button class="btn primary" id="btn-microfono" onclick="iniciarAfinador()" style="margin: 15px 0;">🎤 Activar Micrófono</button>
            <div class="note-display" id="afinador-nota">--</div>
            <div id="afinador-freq" style="font-size:1.1rem; color:#cbd5e1;">0 Hz</div>
          </div>

          <!-- CONTROL DE RESPIRACIÓN ANIMADO -->
          <div class="card" style="text-align: center;">
            <h3 style="margin-top:0;">💨 Control de Respiración Guiado</h3>
            <p class="muted">Sigue el ritmo de expansión y contracción para el soporte diafragmático.</p>
            <div class="breath-circle" id="circulo-aire">Listo</div>
            <button class="btn secondary" onclick="iniciarRespiracionGuiada()">▶️ Iniciar Ciclo (4-4-8)</button>
          </div>
        </div>`;
    }

    // Lógica del Afinador por Frecuencia
    let audioCtx, analyser, dataArray;
    const notasMusicales = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    async function iniciarAfinador() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Float32Array(analyser.fftSize);
        document.getElementById('btn-microfono').style.display = 'none';
        detectarPitchEnVivo();
        toast("Micrófono activado. Cantando...");
      } catch (err) {
        toast("❌ Debes permitir el uso del micrófono.");
      }
    }

    function detectarPitchEnVivo() {
      if(!analyser) return;
      analyser.getFloatTimeDomainData(dataArray);
      let freq = autoCorrelacionPitch(dataArray, audioCtx.sampleRate);
      if (freq !== -1) {
        let numeroNota = 12 * (Math.log2(freq / 440)) + 69;
        let octava = Math.floor(numeroNota / 12) - 1;
        let nombre = notasMusicales[Math.round(numeroNota) % 12];
        const elNota = document.getElementById('afinador-nota');
        const elFreq = document.getElementById('afinador-freq');
        if(elNota && elFreq) {
          elNota.innerText = nombre + octava;
          elFreq.innerText = Math.round(freq) + " Hz";
        }
      }
      requestAnimationFrame(detectarPitchEnVivo);
    }

    function autoCorrelacionPitch(buf, sampleRate) {
      let rms = 0;
      for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / buf.length);
      if (rms < 0.01) return -1;
      let r1 = 0, r2 = buf.length - 1, thres = 0.2;
      for (let i = 0; i < buf.length / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < buf.length / 2; i++) if (Math.abs(buf[buf.length - i]) < thres) { r2 = buf.length - i; break; }
      buf = buf.slice(r1, r2);
      let c = new Array(buf.length).fill(0);
      for (let i = 0; i < buf.length; i++)
        for (let j = 0; j < buf.length - i; j++) c[i] += buf[j] * buf[j + i];
      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < buf.length; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      return sampleRate / maxpos;
    }

    // Lógica de Respiración Animada
    let respTimer;
    function iniciarRespiracionGuiada() {
      const circulo = document.getElementById('circulo-aire');
      if(!circulo) return;
      clearInterval(respTimer);
      
      function cicloResp() {
        circulo.innerText = "Inhala (4s)";
        circulo.classList.remove('exhale');
        circulo.classList.add('inhale');
        setTimeout(() => {
          if(circulo) circulo.innerText = "Sostén (4s)";
        }, 4000);
        setTimeout(() => {
          if(circulo) {
            circulo.innerText = "Exhala (8s)";
            circulo.classList.remove('inhale');
            circulo.classList.add('exhale');
          }
        }, 8000);
      }
      cicloResp();
      respTimer = setInterval(cicloResp, 16000);
      toast("Ciclo de respiración iniciado");
    }

    function playTone(freq){const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type="sine";g.gain.value=.12;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+1);toast(`Nota de referencia: ${Math.round(freq)} Hz`);}
    function recordView(){
     app.innerHTML=`<div class="section-head"><div><h2>🎤 Mi voz</h2><p>Graba tu práctica y escucha tu evolución. El análisis automático solo se mostrará cuando exista una medición real.</p></div></div>
     <div class="grid2"><div class="card"><h3>Grabadora</h3><p class="muted">Permite el acceso al micrófono cuando el navegador lo solicite.</p><button class="btn primary" onclick="startRecording()">🔴 Grabar</button> <button class="btn danger" onclick="stopRecording()">⏹ Detener</button> <button class="btn secondary" onclick="playLastRecording()">▶️ Escuchar</button><div id="recordStatus" style="margin-top:15px"></div></div>
     <div class="card"><h3>ANÁLISIS DE MI VOZ</h3><p class="muted">No se inventarán porcentajes. Esta versión guarda y reproduce grabaciones; el análisis técnico avanzado requiere un motor real de análisis de audio.</p><div class="empty">🎧 Análisis automático todavía no disponible en esta versión.</div></div></div>`;
    }
    function progressView(){
     const areas=[["Técnica vocal",78],["Afinación",70],["Oído",64],["Ritmo",60],["Teoría",82],["Interpretación",45]];
     app.innerHTML=`<div class="section-head"><div><h2>📊 Mi progreso</h2><p>Tu avance real dentro del programa y áreas de estudio.</p></div></div><div class="cards">${areas.map(a=>`<div class="card"><strong>${a[0]}</strong><div style="font-size:28px;font-weight:900;margin:12px 0">${a[1]}%</div><div class="bar"><i style="width:${a[1]}%"></i></div></div>`).join("")}</div><div class="section-head"><div><h2>Programa</h2><p>${STATE.completed.length} de 60 clases completadas.</p></div></div><div class="card"><div class="progress"><i style="width:${pct()}%"></i></div><p class="muted">${pct()}% del recorrido.</p></div>`;
    }
    function notebookView(){
     const notes=STATE.notes[currentClass?.id]||"";
     app.innerHTML=`<div class="section-head"><div><h2>📓 Mi cuaderno de canto</h2><p>Guarda aprendizajes, dificultades y dudas.</p></div></div><div class="card"><h3>Mis apuntes</h3><textarea id="notes" rows="12" placeholder="¿Qué aprendí? ¿Qué me costó? ¿Qué debo practicar? ¿Qué dudas tengo?">${notes}</textarea><button class="btn primary" style="margin-top:12px" onclick="saveNotes()">💾 Guardar apuntes</button></div>`;
    }
    function saveNotes(){const v=document.getElementById("notes").value;const key=currentClass?.id||"general";STATE.notes[key]=v;saveState();toast("Apuntes guardados.");}
    function repertoireView(){
     app.innerHTML=`<div class="section-head"><div><h2>🎵 Mi repertorio</h2><p>Registra canciones y planifica cómo estudiarlas.</p></div></div><div class="card"><div class="grid2"><input id="song" placeholder="Nombre de la canción"><input id="key" placeholder="Tonalidad"><input id="difficulty" placeholder="Dificultad"><input id="range" placeholder="Rango aproximado"></div><textarea id="obs" rows="5" style="margin-top:12px" placeholder="Problemas, respiraciones y observaciones"></textarea><button class="btn primary" style="margin-top:12px" onclick="addSong()">➕ Agregar al repertorio</button></div><div id="songs" class="list" style="margin-top:15px"></div>`;renderSongs();}
    function addSong(){const song={name:document.getElementById("song").value,key:document.getElementById("key").value,difficulty:document.getElementById("difficulty").value,range:document.getElementById("range").value,obs:document.getElementById("obs").value};if(!song.name){toast("Escribe el nombre de la canción.");return}STATE.songs=STATE.songs||[];STATE.songs.push(song);saveState();renderSongs();toast("Canción agregada.");}
    function renderSongs(){const el=document.getElementById("songs");if(!el)return;el.innerHTML=(STATE.songs||[]).map((s,i)=>`<div class="row"><div><strong>${s.name}</strong><small>${s.key||"Tonalidad no registrada"} · ${s.difficulty||"Dificultad no registrada"} · ${s.range||"Rango no registrado"}</small></div><button class="btn danger" onclick="STATE.songs.splice(${i},1);saveState();renderSongs()">Eliminar</button></div>`).join("")||`<div class="empty">Todavía no tienes canciones registradas.</div>`;}
    function settingsView(){app.innerHTML=`<div class="section-head"><div><h2>⚙️ Configuración</h2><p>Datos de esta versión local.</p></div></div><div class="card"><h3>Progreso local</h3><p class="muted">Esta primera versión guarda el progreso en el navegador mediante localStorage.</p><button class="btn danger" onclick="if(confirm('¿Borrar todo el progreso?')){localStorage.removeItem(STORE_KEY);location.reload()}">Borrar progreso</button></div>`;}
    
    function navigate(view){
      document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
      ({
        dashboard,
        classes:classesView,
        exercises:exercisesView,
        ear:earView,
        tools:toolsView,
        record:recordView,
        progress:progressView,
        notebook:notebookView,
        repertoire:repertoireView,
        settings:settingsView
      }[view]||dashboard)();
    }
    
    document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{navigate(b.dataset.view);document.querySelector(".sidebar").classList.remove("open")}));
    document.getElementById("menuToggle").onclick=()=>document.querySelector(".sidebar").classList.toggle("open");
    
    let recorder=null, chunks=[], recordingStream=null;
    async function startRecording(){
      if(!navigator.mediaDevices?.getUserMedia){toast("Tu navegador no permite grabación de audio.");return;}
      try{
        recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
        recorder=new MediaRecorder(recordingStream); chunks=[];
        recorder.ondataavailable=e=>chunks.push(e.data);
        recorder.onstop=()=>{
          const blob=new Blob(chunks,{type:"audio/webm"}), url=URL.createObjectURL(blob);
          window.lastRecording={blob,url,date:new Date().toISOString()};
          document.dispatchEvent(new CustomEvent("recording-ready",{detail:{url}}));
          recordingStream.getTracks().forEach(t=>t.stop());
        };
        recorder.start(); toast("Grabación iniciada");
      }catch(e){toast("No se pudo acceder al micrófono. Revisa los permisos del navegador.");}
    }
    function stopRecording(){if(recorder?.state==="recording"){recorder.stop();toast("Grabación detenida");}}
    function playLastRecording(){if(window.lastRecording?.url)new Audio(window.lastRecording.url).play();else toast("Todavía no tienes una grabación.");}
    
    document.addEventListener("recording-ready",e=>{const el=document.getElementById("recordStatus");if(el)el.innerHTML=`<span style="color:#159b75">✓ Grabación lista.</span> <button class="btn secondary" onclick="playLastRecording()">Escuchar</button>`;});
    function speak(text){if(!("speechSynthesis" in window)){toast("La voz del navegador no está disponible.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="es-CL";u.rate=1;speechSynthesis.speak(u);}
    
    dashboard();
  </script>
